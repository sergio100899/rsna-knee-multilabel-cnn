[project]
name = "rodilla-mri-parcial"
version = "0.1.0"
description = "Clasificación multietiqueta de anomalías de rodilla en RM con CNN y etiquetas débiles (parcial, Pregunta 1)"
requires-python = ">=3.13"
dependencies = [
    "ipykernel==7.4.0",
    "langdetect==1.0.9",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pydicom==3.0.2",
    "pylibjpeg==2.1.0",
    "pylibjpeg-libjpeg==2.4.0",
    "pylibjpeg-openjpeg==2.6.0",
    "scikit-learn==1.9.1",
    "sentence-transformers==6.2.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm==4.70.1",
    "transformers==5.22.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
